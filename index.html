<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع عمر الدراسي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        [data-protected-content] { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- شاشة حماية الوصول (Access Gate) -->
    <div id="accessGate" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 p-4">
        <div class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold text-white">مرحباً بك في موقع عمر الدراسي</h2>
                <p id="accessState" class="text-sm text-slate-400" data-kind="info">سجّل بريدك الإلكتروني لطلب السماح بالدخول.</p>
            </div>

            <!-- نموذج تسجيل الدخول بالـ OTP -->
            <form id="accessForm" class="space-y-4">
                <div>
                    <label for="accessEmail" class="block text-xs font-semibold text-slate-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="accessEmail" required placeholder="name@example.com" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:border-blue-500 focus:outline-none" />
                </div>
                <button type="submit" id="sendAccessLink" class="w-full rounded-xl bg-blue-600 py-3 text-sm font-bold text-white hover:bg-blue-500 transition shadow-lg shadow-blue-600/20">إرسال رابط التحقق</button>
            </form>

            <!-- أزرار تفاعل الجلسة -->
            <div id="accessSessionActions" class="hidden space-y-3 text-center">
                <p class="text-xs text-slate-400">الحساب الحالي: <span id="accessAccountEmail" class="font-bold text-white"></span></p>
                <div class="flex gap-2">
                    <button type="button" id="refreshAccessButton" class="flex-1 rounded-xl bg-slate-800 py-2.5 text-xs font-bold text-slate-200 hover:bg-slate-700 transition">التحقق من الحالة</button>
                    <button type="button" id="signOutButton" class="flex-1 rounded-xl bg-red-500/10 py-2.5 text-xs font-bold text-red-400 hover:bg-red-500/20 transition">تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </div>

    <!-- الشريط العلوي (Navbar) -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-lg font-bold text-white">موقع عمر الدراسي 📚</h1>
            <div class="flex items-center gap-3">
                <!-- زر لوحة تحكم الأدمن (يظهر فقط للمسؤول) -->
                <button id="adminAccessButton" class="hidden rounded-xl bg-purple-600/20 border border-purple-500/30 px-3 py-1.5 text-xs font-bold text-purple-300 hover:bg-purple-600/30 transition">لوحة الأدمن</button>
                <button id="siteSignOutButton" class="hidden rounded-xl bg-slate-800 px-3 py-1.5 text-xs font-bold text-slate-300 hover:bg-slate-700 transition">خروج</button>
            </div>
        </div>
    </header>

    <!-- لوحة تحكم الأدمن (منسدلة) -->
    <div id="adminAccessPanel" class="hidden max-w-7xl mx-auto px-4 mt-4 w-full">
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-6 space-y-4 shadow-xl">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-white">إدارة صلاحيات الوصول والطلبات</h2>
                <button id="refreshRequestsButton" class="text-xs text-blue-400 hover:underline">تحديث القائمة</button>
            </div>
            <p id="adminAccessStatus" class="hidden text-xs"></p>
            <div id="adminAccessRequests" class="space-y-2 max-h-60 overflow-y-auto">
                <!-- سيتم تعبئة الطلبات وحقل الإضافة السريعة هنا تلقائياً من ملف الـ JS -->
            </div>
        </div>
    </div>

    <!-- محتوى الموقع المحمي -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full" data-protected-content hidden>
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-8 text-center space-y-4">
            <h2 class="text-2xl font-bold text-white">أهلاً بك يا عمر في محتواك الدراسي المميز!</h2>
            <p class="text-sm text-slate-400">تم التحقق من هويتك وصلاحياتك بنجاح. يمكنك استعراض الملفات والكتب والمحاضرات الآن.</p>
        </div>
    </main>

    <!-- إعدادات مشروع Supabase (ضع بيانات مشروعك هنا) -->
    <script>
        window.SUPABASE_CONFIG = {
            url: 'YOUR_SUPABASE_URL',
            anonKey: 'YOUR_SUPABASE_ANON_KEY'
        };
    </script>
    <!-- ربط ملف المصادقة -->
    <script src="site-auth.js"></script>
</body>
</html>
